name: furkid_music
description: 哎哟你干嘛~
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.0
  go_router: ^17.0.0
  shared_preferences: ^2.5.5
  just_audio: ^0.10.6
  just_audio_background: ^0.0.1-beta.17
  audio_session: ^0.2.2
  permission_handler: ^13.0.2
  path_provider: ^2.1.5
  http: ^1.6.0
  bilibili_api: ^0.0.1
  crypto: ^3.0.7
  palette_generator: ^0.3.3+7
  flutter_inappwebview: ^6.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true

dependency_overrides:
  permission_handler_android: 13.0.1

# ═══════════════════════════════════════════
# ★ 新增：App 图标配置
# ═══════════════════════════════════════════
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  adaptive_icon_background: "#FF7A59"
  adaptive_icon_foreground: "assets/icon.png"
  remove_alpha_ios: true

# ═══════════════════════════════════════════
# ★ 新增：启动画面配置
# ═══════════════════════════════════════════
flutter_native_splash:
  color: "#F4F5F9"
  image: assets/splash.jpeg
  color_dark: "#1E2231"
  image_dark: assets/splash.jpeg

  # ★ 让图片铺满屏幕
  android_gravity: fill              # Android：拉伸铺满
  ios_content_mode: scaleAspectFill  # iOS：等比铺满 + 裁剪

  android_12:
    image: assets/splash.jpeg
    color: "#F4F5F9"
    icon_background_color: "#FF7A59"
    android_gravity: fill            # Android 12+ 也要加

  fullscreen: true